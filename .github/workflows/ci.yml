name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  repo-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Testes de estrutura e regras do repositório
        run: python -m pytest -q
      - name: Validar sintaxe do Compose (valores fictícios)
        run: make compose-check
