# SOMENTE DESENVOLVIMENTO LOCAL. Não usar em produção, homologação nem no Private.
# Segredos vêm do .env (ignorado pelo Git). Variáveis com ":?" são obrigatórias.
name: kael-dev

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_DB: kael
      POSTGRES_USER: kael_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?defina no .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kael_admin -d kael"]
      interval: 10s
      timeout: 5s
      retries: 5
    # O usuário kael_admin é administrativo: NÃO deve ser usado pela aplicação.
    # O papel de aplicação (sem superuser, sem BYPASSRLS) será criado por migração (ADR-001).

  redis:
    image: ${REDIS_IMAGE:-redis:7}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina no .env}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: ${MINIO_IMAGE:?fixe uma tag especifica no .env}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina no .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina no .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.0}
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?defina no .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?defina no .env}
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
  redisdata:
  miniodata:
